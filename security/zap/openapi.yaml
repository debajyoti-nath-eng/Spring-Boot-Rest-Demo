# API definition used by the OWASP ZAP API scan (security/zap/run-zap.ps1).
# Describes the Item CRUD API in ItemController. Every /api/** call needs X-Client-Type: UI or POSTMAN;
# the ZAP scan adds that header to every request with a replacer rule.
openapi: 3.0.3
info:
  title: spring-boot-rest-demo Item API
  version: 0.0.1
servers:
  - url: http://localhost:8282   # run-zap.ps1 retargets this to the Windows host as seen from the Podman VM
paths:
  /api/items:
    get:
      summary: List all items
      responses:
        "200":
          description: Items
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Item" } }
    post:
      summary: Create an item
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ItemRequest" }
      responses:
        "201": { description: Created }
        "400": { description: Validation error }
  /api/items/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64, example: 1 }
    get:
      summary: Get one item
      responses:
        "200": { description: The item }
        "404": { description: Not found }
    put:
      summary: Update an item
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ItemRequest" }
      responses:
        "200": { description: Updated }
        "404": { description: Not found }
    delete:
      summary: Delete an item
      responses:
        "204": { description: Deleted }
        "404": { description: Not found }
  /actuator/health:
    get:
      summary: Health check
      responses:
        "200": { description: UP }
components:
  schemas:
    ItemRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, example: Keyboard }
        description: { type: string, example: Mechanical keyboard }
    Item:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        description: { type: string }
